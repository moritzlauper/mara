[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixmatch"
version = "0.1.0"
description = "Mixing agent for Ableton Live: listens inside the project, compares with references, adjusts step by step."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "python-osc", "anthropic>=0.80"]

[project.optional-dependencies]
stems = ["demucs"]          # removes vocals from references for beat mode
style = ["transformers", "torch"]   # CLAP: style of a track, similar songs in a library (suggest-refs)
dev = ["pytest"]

[project.scripts]
mixmatch = "mixmatch.cli:main"

[tool.setuptools]
packages = ["mixmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
