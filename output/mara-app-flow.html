<div id="mara-flow-design" aria-label="MARA Desktop: klickbarer Ablaufentwurf">
  <style>
    #mara-flow-design{--m-bg:light-dark(#ece8f1,#16131e);--m-panel:light-dark(#faf8fc,#221d2d);--m-face:light-dark(#e2dbea,#2f283d);--m-ink:light-dark(#241b32,#f1eaf9);--m-muted:light-dark(#665873,#b7aac8);--m-line:light-dark(#c8bed4,#4b3f5d);--m-purple:light-dark(#6636b7,#b995ff);--m-pink:light-dark(#a72d7c,#f5a1d4);--m-button:light-dark(#6636b7,#b995ff);--m-onbutton:light-dark(#ffffff,#211331);font:14px/1.5 system-ui,sans-serif;color:var(--m-ink)}
    #mara-flow-design *{box-sizing:border-box}#mara-flow-design button,#mara-flow-design input,#mara-flow-design textarea,#mara-flow-design select{font:inherit}#mara-flow-design button{cursor:pointer}#mara-flow-design [hidden]{display:none!important}
    #mara-flow-design .m-window{background:var(--m-bg);border:1px solid var(--m-line);border-radius:9px;overflow:hidden}
    #mara-flow-design .m-top{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 22px;border-top:4px solid var(--m-purple);border-bottom:1px solid var(--m-line);background:var(--m-panel);padding-right:105px}
    #mara-flow-design .m-logo{font:800 25px/1 monospace;letter-spacing:3px}#mara-flow-design .m-demo{font:11px/1.4 monospace;letter-spacing:.04em;color:var(--m-muted)}
    #mara-flow-design .m-body{display:grid;grid-template-columns:190px minmax(0,1fr)}
    #mara-flow-design .m-rail{padding:24px 14px;background:var(--m-panel);border-right:1px solid var(--m-line)}
    #mara-flow-design .m-project{padding:0 9px 20px;overflow-wrap:anywhere}#mara-flow-design .m-project small{display:block;color:var(--m-muted);margin-top:4px}
    #mara-flow-design .m-step{display:flex;align-items:center;gap:9px;width:100%;background:transparent;color:var(--m-muted);border:0;text-align:left;padding:12px 9px;margin:4px 0;border-radius:4px}
    #mara-flow-design .m-step[aria-current="step"]{background:var(--m-face);color:var(--m-ink);box-shadow:inset 3px 0 var(--m-purple)}
    #mara-flow-design .m-stepnum{font:12px monospace;min-width:18px;color:var(--m-purple)}
    #mara-flow-design .m-railnote{font-size:12px;color:var(--m-muted);margin:24px 9px 0}
    #mara-flow-design .m-main{min-width:0;padding:26px;min-height:555px}#mara-flow-design .m-eyebrow{font:11px/1.4 monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--m-purple);margin-bottom:7px}
    #mara-flow-design h2{font-size:25px;line-height:1.2;margin:0 0 9px;letter-spacing:-.6px;font-weight:650}#mara-flow-design h3{font-size:14px;margin:0 0 8px;font-weight:650}#mara-flow-design p{margin:0}#mara-flow-design .m-sub{color:var(--m-muted);margin-bottom:22px;max-width:650px}
    #mara-flow-design .m-card{background:var(--m-panel);border:1px solid var(--m-line);padding:16px;margin:12px 0;border-radius:5px}
    #mara-flow-design .m-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#mara-flow-design .m-between{justify-content:space-between}#mara-flow-design .m-muted{color:var(--m-muted);font-size:12px}#mara-flow-design .m-tag{background:var(--m-face);color:var(--m-ink);padding:3px 8px;font-size:11px;border-radius:3px;white-space:nowrap}
    #mara-flow-design .m-button{padding:9px 13px;background:var(--m-panel);color:var(--m-ink);border:1px solid var(--m-line);border-radius:4px}#mara-flow-design .m-button.primary{background:var(--m-button);color:var(--m-onbutton);border-color:var(--m-button)}#mara-flow-design .m-button[aria-pressed="true"]{background:var(--m-face);border-color:var(--m-purple);color:var(--m-ink)}#mara-flow-design .m-button:disabled{cursor:default;opacity:.5}
    #mara-flow-design .m-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
    #mara-flow-design .m-field{display:block;margin:16px 0 7px;font-weight:550}#mara-flow-design textarea,#mara-flow-design select,#mara-flow-design input[type="text"]{width:100%;background:var(--m-panel);color:var(--m-ink);border:1px solid var(--m-line);padding:9px;border-radius:4px;min-width:0}
    #mara-flow-design .m-check{display:flex;align-items:center;gap:8px}#mara-flow-design input{accent-color:var(--m-purple)}#mara-flow-design .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#mara-flow-design .m-grid .m-card{margin:0}
    #mara-flow-design .m-ref{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}#mara-flow-design .m-ref strong{display:block}#mara-flow-design .m-cover{height:42px;width:42px;display:grid;place-items:center;background:var(--m-face);font:17px monospace;color:var(--m-purple)}
    #mara-flow-design .m-drop{border:1px dashed var(--m-line);padding:22px;text-align:center;color:var(--m-muted);margin:14px 0;border-radius:4px}
    #mara-flow-design .m-facts{display:grid;gap:10px;margin-top:12px}#mara-flow-design .m-fact{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--m-line)}#mara-flow-design .m-fact:last-child{border:0}
    #mara-flow-design .m-tracklist{display:grid;gap:0;margin-top:18px}#mara-flow-design .m-trackrow{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--m-line);font-size:13px}
    #mara-flow-design .m-runsteps{display:grid;gap:14px;margin:22px 0}#mara-flow-design .m-runstep{display:flex;gap:11px;align-items:baseline;color:var(--m-muted)}#mara-flow-design .m-runstep.current{color:var(--m-ink);font-weight:600}#mara-flow-design .m-runstep small{font-weight:400;color:var(--m-muted)}
    #mara-flow-design .m-progress{height:7px;background:var(--m-face);overflow:hidden;margin:16px 0 8px}#mara-flow-design .m-progress>span{display:block;height:100%;width:63%;background:var(--m-purple)}
    #mara-flow-design .m-listtabs{display:flex;gap:8px;margin:22px 0 10px;flex-wrap:wrap}#mara-flow-design .m-change{background:var(--m-panel);border:1px solid var(--m-line);border-radius:4px;margin:8px 0}#mara-flow-design .m-change summary{cursor:pointer;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}#mara-flow-design .m-change summary strong{font-weight:600;display:block}#mara-flow-design .m-change summary small{display:block;color:var(--m-muted);margin-top:3px}#mara-flow-design .m-changebody{padding:0 13px 14px;border-top:1px solid var(--m-line)}
    #mara-flow-design .m-diff{display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:10px 0;font-size:12px;font-variant-numeric:tabular-nums}#mara-flow-design .m-diff span:not(:first-child){text-align:right}#mara-flow-design .m-diffhead{color:var(--m-muted);font-size:11px}
    #mara-flow-design .m-proof{display:grid;grid-template-columns:65px 1fr;gap:6px 10px;margin-top:12px;font-size:12px}#mara-flow-design .m-proof dt{color:var(--m-muted)}#mara-flow-design .m-proof dd{margin:0;overflow-wrap:anywhere}
    #mara-flow-design .m-player{border:1px solid var(--m-line);background:var(--m-panel);border-radius:5px;padding:14px;margin:18px 0}#mara-flow-design .m-playerline{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}#mara-flow-design .m-seek{flex:1;min-width:100px}
    #mara-flow-design .m-foot{background:var(--m-panel);padding:11px 22px;border-top:1px solid var(--m-line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--m-muted);font-size:11px}
    #mara-flow-design .m-notice{border-left:3px solid var(--m-purple);background:var(--m-face);padding:10px 12px;margin:14px 0;font-size:12px}#mara-flow-design .m-confirm{border:1px solid var(--m-pink);padding:16px;background:var(--m-panel);margin:12px 0}#mara-flow-design .m-confirm p{margin:8px 0 12px}
    #mara-flow-design.m-compact .m-change summary{padding:8px 13px}#mara-flow-design.m-compact .m-main{padding:20px}
    @media(max-width:650px){#mara-flow-design .m-body{grid-template-columns:1fr}#mara-flow-design .m-rail{border-right:0;border-bottom:1px solid var(--m-line);padding:12px}#mara-flow-design .m-project,#mara-flow-design .m-railnote{display:none}#mara-flow-design .m-nav{display:flex;flex-wrap:wrap;gap:4px}#mara-flow-design .m-step{width:auto;padding:7px;margin:0;font-size:12px}#mara-flow-design .m-main{padding:18px;min-height:0}#mara-flow-design .m-grid{grid-template-columns:1fr}#mara-flow-design .m-top{padding-left:18px}#mara-flow-design .m-diff{gap:10px}#mara-flow-design .m-ref{grid-template-columns:auto minmax(0,1fr)}#mara-flow-design .m-ref>label{grid-column:2}#mara-flow-design h2{font-size:22px}}
  </style>
  <div class="m-window">
    <header class="m-top"><span class="m-logo">MARA</span><span class="m-demo">DESKTOP-ENTWURF · BEISPIELDATEN</span></header>
    <div class="m-body">
      <aside class="m-rail">
        <div class="m-project"><strong>lingottofiere</strong><small>Ableton Live · verbunden</small></div>
        <nav class="m-nav" aria-label="Mix-Ablauf">
          <button class="m-step" data-stage="0"><span class="m-stepnum">01</span>Projekt & Ziel</button>
          <button class="m-step" data-stage="1"><span class="m-stepnum">02</span>Referenzen</button>
          <button class="m-step" data-stage="2"><span class="m-stepnum">03</span>Mix verstehen</button>
          <button class="m-step" data-stage="3"><span class="m-stepnum">04</span>Mixen</button>
          <button class="m-step" data-stage="4"><span class="m-stepnum">05</span>Ergebnis</button>
        </nav>
        <p class="m-railnote">Ein Projekt.<br>Referenzen, Durchgänge und Original bleiben zusammen.</p>
      </aside>
      <main class="m-main" id="mara-flow-screen"></main>
    </div>
    <footer class="m-foot"><span id="mara-flow-footer">Ableton Live verbunden</span><span>macOS / Windows · gleicher Ablauf</span></footer>
  </div>
  <script>
  (() => {
    const root=document.getElementById('mara-flow-design');
    const screen=root.querySelector('#mara-flow-screen');
    const footer=root.querySelector('#mara-flow-footer');
    const state={stage:4, paused:false, filter:'kept', selected:'after', equal:true, reference:true, restored:false, confirm:false, extraRef:'', brief:'Mehr Platz zwischen Keys und Lead. Den warmen Charakter und den Groove erhalten.'};
    const design={compact:false};
    const saved=window.openai?.widgetState?.privateContent;
    if(saved && Number.isInteger(saved.stage) && saved.stage>=0 && saved.stage<5) Object.assign(state,saved);
    const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const persist=()=>window.openai?.setWidgetState?.({modelContent:{screen:['Projekt & Ziel','Referenzen','Mix verstehen','Mixen','Ergebnis'][state.stage], focus:'Änderungen nachvollziehen',standalone:'App mit Ableton-Anbindung'},privateContent:{stage:state.stage,paused:state.paused,filter:state.filter,selected:state.selected,equal:state.equal}})?.catch(()=>{});
    const button=(label,action,primary=false,extra='')=>`<button class="m-button${primary?' primary':''}" data-action="${action}" ${extra}>${label}</button>`;
    const head=(step,title,sub)=>`<div class="m-eyebrow">${step}</div><h2>${title}</h2><p class="m-sub">${sub}</p>`;
    const changes=[
      {channel:'11-mkgee rhodes',device:'EQ Eight',summary:'Tiefmitten zurückgenommen',param:'Band 2 · 403 Hz',before:'0,0 dB',after:'−1,5 dB',reason:'Die Keys verdecken den Lead in diesem Abschnitt.',proof:'Weniger gleichzeitige Überlagerung; Pegel und Anschlag mitgeprüft.',scope:'Takte 98–114 · auf der Keys-Spur'},
      {channel:'22-Serum',device:'Mixer',summary:'Bass leicht abgesenkt',param:'Lautstärke',before:'−5,0 dB',after:'−6,0 dB',reason:'Die Kick soll gegenüber dem Bass mehr Platz bekommen.',proof:'Die Änderung wurde in derselben Passage gegengehört und gemessen.',scope:'Takte 98–114 · auf der Bass-Spur'},
      {channel:'9-Audio',device:'Redux',summary:'Effekt deaktiviert',param:'Device On',before:'Ein',after:'Aus',reason:'Der Effekt liefert in der geprüften Passage keinen belegten Nutzen.',proof:'On/Off-Vergleich; Gerät bleibt im Set und kann wieder aktiviert werden.',scope:'Takte 17–25 · auf der Pad-Spur'}
    ];
    function changeCard(c,i){return `<details class="m-change" ${i===0?'open':''}><summary><span><strong>${c.channel} · ${c.device}</strong><small>${c.summary}</small></span><span class="m-tag">Details ↓</span></summary><div class="m-changebody"><div class="m-diff m-diffhead"><span>Parameter</span><span>Original</span><span>Ergebnis</span></div><div class="m-diff"><span>${c.param}</span><span>${c.before}</span><span>${c.after}</span></div><dl class="m-proof"><dt>Warum</dt><dd>${c.reason}</dd><dt>Geprüft</dt><dd>${c.proof}</dd><dt>Gültig für</dt><dd>${c.scope}</dd></dl></div></details>`;}
    function render(){
      root.classList.toggle('m-compact',design.compact);
      root.querySelectorAll('[data-stage]').forEach(b=>{if(Number(b.dataset.stage)===state.stage)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
      footer.textContent=state.restored?'Entwurf: Original wiederhergestellt':state.stage===3?(state.paused?'Pausiert · letzter sicherer Stand gespeichert':'Stummer Durchgang · Änderungen direkt in Live'):'Ableton Live verbunden · Original gesichert';
      if(state.stage===0) screen.innerHTML=head('01 · Projekt & Ziel','Was soll dein Mix erreichen?','Das offene Live-Set bildet das Projekt. MARA merkt sich Ziel, Referenzen und bisherige Durchgänge.')+`<div class="m-card"><div class="m-row m-between"><strong>lingottofiere</strong><span class="m-tag">Live verbunden</span></div><div class="m-facts"><div class="m-fact"><span>Messverbindung</span><span>Bereit</span></div><div class="m-fact"><span>Audio-Ausgang</span><span>1/2 · erreichbar</span></div></div></div><label class="m-field" for="mara-flow-mode">Art des Projekts</label><select id="mara-flow-mode"><option>Beat · Platz für spätere Vocals</option><option>Song mit Vocals</option></select><label class="m-field" for="mara-flow-brief">Was ist dir wichtig?</label><textarea id="mara-flow-brief" rows="3">${esc(state.brief)}</textarea><div class="m-actions"><span class="m-muted">Beim nächsten Öffnen hier weiterarbeiten.</span>${button('Referenzen wählen →','next',true)}</div>`;
      if(state.stage===1) screen.innerHTML=head('02 · Referenzen','Deine klangliche Richtung','Wähle die Tracks, an denen sich MARA orientieren soll. Dein Mix behält seinen eigenen Charakter.')+`<div class="m-row">${button('Dateien hinzufügen','import')}${button('Aus Live übernehmen','fromlive')}<input type="file" id="mara-flow-file" accept="audio/*" hidden></div><div class="m-card m-ref"><div class="m-cover">♫</div><div><strong>Overmono · So U Kno</strong><span class="m-muted">Für dieses Projekt ausgewählt</span></div><label class="m-check"><input id="mara-flow-reference" type="checkbox" ${state.reference?'checked':''}>Verwenden</label></div>${state.extraRef?`<div class="m-card"><strong>${esc(state.extraRef)}</strong><p class="m-muted">Im Entwurf hinzugefügt</p></div>`:''}<div class="m-drop">Referenzdateien hier ablegen<br><span class="m-muted">oder aus deiner Bibliothek auswählen</span></div><label class="m-field" for="mara-flow-reference-note">Was gefällt dir an der Referenz?</label><input id="mara-flow-reference-note" type="text" value="Druckvolle Drums und klare Trennung zwischen den Schichten"><p class="m-muted" style="margin-top:8px">Referenzen werden vor dem Mixing bestätigt.</p><div class="m-actions">${button('← Projekt','back')}${button('Mix analysieren →','next',true,!state.reference&&!state.extraRef?'disabled':'')}</div>`;
      if(state.stage===2) screen.innerHTML=head('03 · Mix verstehen','Das hat MARA erkannt','Prüfe die wichtigen Rollen und den Plan. Die Analyse verändert noch keine Mix-Parameter.')+`<div class="m-grid"><div class="m-card"><h3>Zuerst prüfen</h3><p>Überlagerungen zwischen Keys und Lead</p><p class="m-muted" style="margin-top:8px">Vor allem in den Tiefmitten des dichten Abschnitts.</p></div><div class="m-card"><h3>Bewahren</h3><p>Wärme, Groove und den Kick-Anschlag</p><p class="m-muted" style="margin-top:8px">Die Referenz gibt die Richtung vor.</p></div></div><div class="m-tracklist"><div class="m-trackrow"><span>22-Serum</span><select aria-label="Rolle von 22-Serum"><option>Bass</option><option>Lead</option><option>Pad</option></select></div><div class="m-trackrow"><span>11-mkgee rhodes</span><select aria-label="Rolle von Rhodes"><option>Keys · Begleitung</option><option>Lead</option><option>Pad</option></select></div></div><div class="m-notice">Original-Vorschau bereit · Takte 98–114<br>Beim Start werden geprüfte Änderungen direkt in Live angewendet.</div><label class="m-check"><input type="checkbox" checked>Stumm arbeiten</label><div class="m-actions">${button('← Referenzen','back')}${button('Mix starten →','next',true)}</div>`;
      if(state.stage===3) screen.innerHTML=head('04 · Mixen',state.paused?'Pausiert. Dein Stand bleibt erhalten.':'MARA schafft Platz zwischen Keys und Lead.',state.paused?'Fortsetzen beginnt beim letzten sicheren Arbeitsschritt.':'Aktuell: 11-mkgee rhodes · Takte 98–114. Änderungen werden geprüft, bevor MARA sie behält.')+`<div class="m-runsteps"><div class="m-runstep"><span>✓</span><span>Technische Vorprüfung & Original sichern</span></div><div class="m-runstep"><span>✓</span><span>Master und Referenz einordnen</span></div><div class="m-runstep current"><span>→</span><span>Kanalbalance verbessern <small>· aktuell</small></span></div><div class="m-runstep"><span>○</span><span>Effekte prüfen · behalten oder umgehen</span></div><div class="m-runstep"><span>○</span><span>Abschluss prüfen & After aufnehmen</span></div></div><div class="m-progress" role="progressbar" aria-label="Beispiel-Fortschritt" aria-valuenow="63" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="m-row m-between"><span class="m-muted">Beispielfortschritt · 63 %</span>${button(state.paused?'Fortsetzen':'Pause','pause',true)}</div><details class="m-card"><summary>Letzte geprüfte Änderung</summary><p style="margin-top:10px">Keys · EQ Eight · 403 Hz: 0,0 → −1,5 dB</p><p class="m-muted">Weniger Überlagerung mit dem Lead in dieser Passage.</p></details><div class="m-actions"><span class="m-muted">Original und Referenzen bleiben verfügbar.</span>${button('Ergebnis ansehen →','next')}</div>`;
      if(state.stage===4) screen.innerHTML=head('05 · Ergebnis',state.restored?'Original wiederhergestellt.':'Dein Mix-Durchgang ist abgeschlossen.',state.restored?'Im echten Produkt würden jetzt die gesicherten Original-Einstellungen in Live gelten.':'Original und Ergebnis sind hörbereit. Der MARA-Mix liegt bereits in Live. Jetzt kannst du vergleichen und die Änderungen nachvollziehen.')+`<div class="m-player"><div class="m-row m-between"><div class="m-row">${button('A · Original','before',false,`aria-pressed="${state.selected==='before'}"`)}${button('B · MARA-Mix','after',false,`aria-pressed="${state.selected==='after'}"`)}</div><label class="m-check"><input id="mara-flow-equal" type="checkbox" ${state.equal?'checked':''}>Gleiche Lautheit</label></div><div class="m-playerline"><button class="m-button" disabled aria-label="Audiowiedergabe nur im fertigen Produkt">▶</button><input class="m-seek" type="range" min="0" max="28" value="0" aria-label="Position in der Beispielvorschau"><span class="m-muted">0:00 / 0:28</span></div><p class="m-muted" style="margin-top:8px">Takte 98–114 · Player-Entwurf ohne Audio</p></div><div class="m-row m-between"><h3>Was hat MARA verändert?</h3><span class="m-muted">Original → Ergebnis</span></div><div class="m-listtabs">${button('Beibehalten · 3','kept',false,`aria-pressed="${state.filter==='kept'}"`)}${button('Zurückgenommen · 1','rejected',false,`aria-pressed="${state.filter==='rejected'}"`)}</div>${state.filter==='kept'?changes.map(changeCard).join(''):`<div class="m-card"><h3>Main · Compressor</h3><p>Mehr Kompression ausprobiert und zurückgenommen.</p><dl class="m-proof"><dt>Warum</dt><dd>Die Transienten wurden schwächer, ohne belegten Nutzen.</dd><dt>Endstand</dt><dd>Originale Kompressoreinstellung wiederhergestellt.</dd></dl></div>`}${state.confirm?`<div class="m-confirm" role="alert"><h3>Original wiederherstellen?</h3><p>Die 3 beibehaltenen Änderungen dieses Durchgangs würden zurückgesetzt. Spätere manuelle Änderungen müssen vorher geprüft werden.</p><div class="m-row">${button('Abbrechen','cancel')}${button('Original wiederherstellen','restore',true)}</div></div>`:''}<div class="m-actions">${button('Original wiederherstellen …','confirm',false,state.restored?'disabled':'')}${button('Neuen Durchgang vorbereiten','newrun')}</div>`;
      screen.querySelector('#mara-flow-brief')?.addEventListener('input',e=>{state.brief=e.target.value;});
      screen.querySelector('#mara-flow-reference')?.addEventListener('change',e=>{state.reference=e.target.checked;render();persist();});
      screen.querySelector('#mara-flow-equal')?.addEventListener('change',e=>{state.equal=e.target.checked;persist();});
      screen.querySelector('#mara-flow-file')?.addEventListener('change',e=>{state.extraRef=e.target.files[0]?.name||'';render();persist();});
    }
    root.addEventListener('click',e=>{
      const step=e.target.closest('[data-stage]');if(step){state.stage=Number(step.dataset.stage);render();persist();return;}
      const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
      if(action==='import'){screen.querySelector('#mara-flow-file').click();return;}
      if(action==='newrun'){state.stage=0;state.confirm=false;}
      if(action==='next')state.stage=Math.min(4,state.stage+1);
      if(action==='back')state.stage=Math.max(0,state.stage-1);
      if(action==='pause')state.paused=!state.paused;
      if(action==='kept'||action==='rejected')state.filter=action;
      if(action==='before'||action==='after')state.selected=action;
      if(action==='confirm')state.confirm=true;
      if(action==='cancel')state.confirm=false;
      if(action==='restore'){state.confirm=false;state.restored=true;state.selected='before';}
      if(action==='fromlive')state.extraRef='REF · aus dem Live-Set';
      render();persist();
    });
    window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent;if(incoming && Number.isInteger(incoming.stage) && incoming.stage>=0 && incoming.stage<5){Object.assign(state,incoming);render();}});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'Kompakte Darstellung'});}
  })();
  </script>
</div>
